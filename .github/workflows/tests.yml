# Opens tests/index.html in headless Chrome on every push and pull request.
# The page marks <body data-result="pass"> when every rule test passes.
name: tests

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rule tests in headless Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom "file://$GITHUB_WORKSPACE/tests/index.html" > result.html
          grep -o 'id="summary"[^<]*<' result.html || true
          grep -q 'data-result="pass"' result.html
